name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # Python は .python-version (3.12)、PyTorch は uv.lock (CUDA 12.8 index) に従う。
      # GPU の無いランナーでも全テストが CPU で動く (事前学習重み・データセットは不要)。
      # eval extra は matplotlib を使う可視化テスト (未インストールだと skip) のため。
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra eval

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest tests/ -q
